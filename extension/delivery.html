<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>投递助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: #222; }
  body { display: flex; }

  /* ===== 左侧侧边栏 ===== */
  .sidebar {
    width: 160px;
    flex-shrink: 0;
    background: #f6f8fb;
    border-right: 1px solid #e6e8ee;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar h1 {
    font-size: 14px;
    font-weight: 600;
    color: #12a64f;
    padding: 0 16px 16px;
    border-bottom: 1px solid #e6e8ee;
    margin-bottom: 12px;
  }
  .tab-item {
    all: unset;
    display: block;
    padding: 10px 16px;
    cursor: pointer;
    color: #555;
    border-left: 3px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
    font-size: 14px;
  }
  .tab-item:hover { background: #eef3ff; color: #2b5cd9; }
  .tab-item.active {
    background: #eef3ff;
    color: #2b5cd9;
    border-left-color: #2b5cd9;
    font-weight: 600;
  }

  /* ===== 右侧内容区 ===== */
  .content {
    flex: 1;
    padding: 24px 28px;
    overflow-y: auto;
    background: #fff;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .tab-panel h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #111;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .refresh-btn {
    all: unset;
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background .12s;
  }
  .refresh-btn:hover { background: #eef3ff; }
  .refresh-btn:active { background: #dde8ff; }
  .refresh-btn.spinning { animation: spin .6s linear; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .url-box {
    padding: 10px 14px;
    background: #f6f8fb;
    border: 1px solid #e6e8ee;
    border-radius: 8px;
    font-size: 13px;
    color: #444;
    word-break: break-all;
    margin-bottom: 12px;
  }
  .position-label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .position-label.green { color: #12a64f; }
  .position-label.red { color: #e53935; }
  .position-selector {
    padding: 0;
    display: flex;
  }
  .position-selector select,
  .position-selector input {
    all: unset;
    box-sizing: border-box;
    flex: 1;
    padding: 10px 14px;
    font-size: 13px;
    color: #444;
    background: transparent;
  }
  .position-selector select {
    cursor: pointer;
    appearance: auto;
  }
  .position-selector input::placeholder {
    color: #aaa;
  }
  .submit-wrap {
    text-align: center;
    margin-top: 8px;
    margin-bottom: 12px;
  }
  .submit-wrap button {
    all: unset;
    box-sizing: border-box;
    display: inline-block;
    padding: 9px 48px;
    font-size: 15px;
    font-weight: 600;
    color: #12a64f;
    background: #eafaf1;
    border: 1px solid #12a64f;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s;
  }
  .submit-wrap button:hover { background: #d9f5e4; }
  .submit-wrap button:active { background: #c8edda; }
  .placeholder {
    padding: 40px 0;
    text-align: center;
    color: #aaa;
    font-size: 13px;
  }

  /* ===== 我的投递 — 表格 ===== */
  .mine-table-wrap {
    overflow-x: auto;
    margin-top: 4px;
  }
  .mine-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    table-layout: fixed;
  }
  .mine-table th {
    text-align: left;
    padding: 8px 10px;
    background: #f6f8fb;
    border-bottom: 2px solid #e6e8ee;
    font-weight: 600;
    color: #555;
    white-space: nowrap;
  }
  .mine-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #eef0f4;
    vertical-align: middle;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mine-table tr:hover td { background: #f9fafb; }
  .mine-table tbody tr.empty-row td { text-align: center; color: #aaa; padding: 32px 0; }
  .edit-btn, .del-btn { all: unset; cursor: pointer; font-size: 14px; padding: 4px 6px; border-radius: 4px; transition: background .12s; }
  .edit-btn:hover { background: #eef3ff; }
  .del-btn:hover { background: #fef0f0; }
  .mine-table .col-id { width: 90px; }
  .mine-table .col-time { width: 150px; }
  .mine-table .col-url { width: auto; }
  .mine-table .col-company { width: 120px; }
  .mine-table .col-position-sent { width: 120px; }
  .mine-table .col-position-unfilled { width: 120px; }
  .mine-table .col-action { width: 60px; white-space: nowrap; text-align: center; }
  .mine-table .col-action-del { width: 60px; white-space: nowrap; text-align: center; }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>💼 投递助手</h1>
    <button class="tab-item active" data-tab="current">当前投递</button>
    <button class="tab-item" data-tab="mine">我的投递</button>
  </aside>

  <main class="content">
    <section class="tab-panel active" id="panel-current">
      <h2>当前投递<button class="refresh-btn" id="refresh-btn" type="button" title="刷新当前网页数据">🔄</button></h2>
      <div class="url-box" id="current-url">（未获取到网址）</div>
      <div class="url-box" id="company-name">（未解析到公司名）</div>
      <div class="position-label green">已投岗位</div>
      <div class="url-box position-selector">
        <select id="position-select">
          <option value="软件测试工程师" selected>软件测试工程师</option>
          <option value="硬件测试工程师">硬件测试工程师</option>
          <option value="测试开发工程师">测试开发工程师</option>
          <option value="测试工程师">测试工程师</option>
          <option value="__other__">其他</option>
        </select>
        <input id="position-other" type="text" placeholder="其他岗位" style="display:none" />
      </div>
      <div class="position-label red">待投岗位</div>
      <div class="url-box position-selector">
        <select id="position-select-unfilled">
          <option value="无" selected>无</option>
          <option value="软件测试工程师">软件测试工程师</option>
          <option value="硬件测试工程师">硬件测试工程师</option>
          <option value="测试开发工程师">测试开发工程师</option>
          <option value="测试工程师">测试工程师</option>
          <option value="__other__">其他</option>
        </select>
        <input id="position-other-unfilled" type="text" placeholder="其他岗位" style="display:none" />
      </div>
      <div class="submit-wrap">
        <button id="submit-btn" type="button">Submit</button>
      </div>
      <p class="placeholder">（框架占位，功能待后续迭代）</p>
    </section>
    <section class="tab-panel" id="panel-mine">
      <h2>我的投递</h2>
      <div class="mine-table-wrap">
        <table class="mine-table" id="mine-table">
          <thead>
            <tr>
              <th class="col-id">NUM</th>
              <th class="col-time">投递时间</th>
              <th class="col-url">URL</th>
              <th class="col-company">公司名</th>
              <th class="col-position-sent">已投岗位</th>
              <th class="col-position-unfilled">待投岗位</th>
              <th class="col-action">修改</th>
              <th class="col-action-del">删除</th>
            </tr>
          </thead>
          <tbody id="mine-tbody">
            <tr class="empty-row"><td colspan="8">暂无投递记录，去「当前投递」Submit 吧 ☝️</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="delivery.js"></script>
</body>
</html>
